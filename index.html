/* ===== ކުލަތައް ===== */
:root{
  --bg:#f3f5fa; --surface:#ffffff; --surface-2:#f8f9fc;
  --ink:#1a2135; --ink-2:#3b4459; --muted:#6b7488; --line:#e3e7f0;
  --accent:#2c4cfd; --accent-ink:#ffffff; --accent-soft:#eaeeff;
  --hot:#e4572e; --hot-soft:#fdeee9; --gold:#b7861b;
  --shadow:0 1px 2px rgba(20,30,60,.04),0 6px 20px rgba(20,30,60,.06);
  --shadow-lg:0 10px 34px rgba(20,30,60,.12);
  --radius:16px; --fs:1;
  --body-font:"MV Waheed Site","MV Waheed","Faruma",sans-serif;
  --head-font:"Aaamu FK","MV Aaamu FK","Faruma",sans-serif;
  --arabic-font:"KFGQPC Uthman Taha Naskh","Amiri","Traditional Arabic",serif;
  --ui-font:system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1320; --surface:#161d2d; --surface-2:#1b2335;
    --ink:#e8ecf5; --ink-2:#c3cad9; --muted:#97a1b6; --line:#273047;
    --accent:#8094ff; --accent-ink:#0e1320; --accent-soft:#1f2848;
    --hot:#ff7a52; --hot-soft:#3a2219; --gold:#e0b44a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
    --shadow-lg:0 10px 34px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1320; --surface:#161d2d; --surface-2:#1b2335;
  --ink:#e8ecf5; --ink-2:#c3cad9; --muted:#97a1b6; --line:#273047;
  --accent:#8094ff; --accent-ink:#0e1320; --accent-soft:#1f2848;
  --hot:#ff7a52; --hot-soft:#3a2219; --gold:#e0b44a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --shadow-lg:0 10px 34px rgba(0,0,0,.45);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body-font);font-size:20px;line-height:1.9;transition:background .25s,color .25s}
a{color:inherit;text-decoration:none}
img{display:block;width:100%;height:100%;object-fit:cover}
button{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--head-font);font-weight:400;margin:0;font-synthesis:none}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
.num{font-family:var(--ui-font);direction:ltr;unicode-bidi:isolate}

/* ===== މަތީ ރޮނގު ===== */
.topbar{background:var(--ink);color:#d7dcea;font-size:16px}
:root[data-theme="dark"] .topbar{background:#0a0e18}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .topbar{background:#0a0e18}}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;flex-wrap:wrap}
.dates{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.dates .sep{opacity:.4}
.tools{display:flex;gap:6px;align-items:center}
.tool{background:rgba(255,255,255,.08);border:0;border-radius:999px;padding:4px 12px;cursor:pointer;color:#e7eaf5;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.tool:hover{background:rgba(255,255,255,.18)}

/* ===== އިޝްތިހާރު ===== */
.ad-wrap{padding-top:18px;padding-bottom:6px}
.ad-label{font-family:var(--ui-font);font-size:11px;letter-spacing:.08em;color:var(--muted);text-align:left;direction:ltr;margin-bottom:4px}
.ad{position:relative;overflow:hidden;border-radius:var(--radius);display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:28px;padding:28px 36px;min-height:170px;
  background:radial-gradient(120% 140% at 100% 0%,#4a64ff 0%,#2c4cfd 38%,#1a2fa8 100%);color:#fff;box-shadow:var(--shadow-lg)}
.ad::before,.ad::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.ad::before{width:340px;height:340px;left:-90px;top:-170px}
.ad::after{width:220px;height:220px;left:22%;bottom:-150px}
.ad .ad-logo{width:96px;height:96px;background:#fff;border-radius:24px;padding:12px;position:relative;z-index:1}
.ad .ad-logo img{object-fit:contain}
.ad .ad-text{position:relative;z-index:1}
.ad .ad-kicker{display:inline-block;background:rgba(255,255,255,.18);border-radius:999px;padding:2px 14px;font-size:15px;margin-bottom:6px}
.ad h2{font-size:38px;line-height:1.6}
.ad p{margin:2px 0 0;font-size:19px;opacity:.92}
.ad .ad-btn{position:relative;z-index:1;background:#ffd23f;color:#1a2135;border-radius:999px;padding:12px 28px;font-family:var(--head-font);font-size:22px;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.2);transition:transform .2s}
.ad .ad-btn:hover{transform:translateY(-2px)}
.ad.has-image{display:block;padding:0;min-height:0;background:var(--surface)}
.ad.has-image::before,.ad.has-image::after{display:none}
.ad.has-image img{aspect-ratio:1100/240;height:auto}

/* ===== ހެޑަރު ===== */
header.site{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin-top:14px}
.nav{display:flex;align-items:center;gap:24px;height:78px}
.logo{display:inline-flex;align-items:center;gap:12px;font-family:var(--head-font);font-size:38px;color:var(--accent);line-height:1;white-space:nowrap}
.logo img{width:50px;height:50px;object-fit:contain;flex:none}
.menu{display:flex;gap:6px;flex:1;overflow-x:auto;scrollbar-width:none}
.menu a{font-size:21px;white-space:nowrap;padding:6px 14px;border-radius:999px;color:var(--ink-2);transition:background .2s,color .2s}
.menu a:hover{background:var(--accent-soft);color:var(--accent)}
.menu a.active{background:var(--accent);color:var(--accent-ink)}
.actions{display:flex;align-items:center;gap:10px;direction:ltr}
.btn{font-family:var(--ui-font);font-size:15px;padding:9px 22px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;cursor:pointer}
.btn.dark{background:var(--ink);color:var(--bg)}
.icon-btn{background:var(--surface-2);border:1px solid var(--line);border-radius:50%;width:44px;height:44px;display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.burger{display:none}

/* ===== އާ ޚަބަރު ޓިކަރ ===== */
.ticker{display:flex;align-items:center;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:22px 0 8px;box-shadow:var(--shadow)}
.ticker .tag{flex:none;background:var(--hot);color:#fff;font-family:var(--head-font);font-size:19px;padding:8px 22px;display:flex;align-items:center;gap:8px}
.ticker .tag .dot{width:9px;height:9px;border-radius:50%;background:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.ticker .viewport{overflow:hidden;flex:1;mask-image:linear-gradient(to left,transparent,#000 4%,#000 96%,transparent)}
.ticker .track{display:inline-flex;width:max-content;animation:tick 40s linear infinite}
.ticker:hover .track{animation-play-state:paused}
.ticker .track a{padding:8px 26px;white-space:nowrap;font-size:19px;border-left:1px solid var(--line)}
.ticker .track a:hover{color:var(--hot)}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(50%)}}
@media (prefers-reduced-motion:reduce){.ticker .track{animation:none}}

/* ===== ސެކްޝަން ސުރުހީ ===== */
.sec-head{display:flex;align-items:center;gap:14px;margin:52px 0 20px}
.sec-head h2{font-size:30px;display:flex;align-items:center;gap:12px}
.sec-head h2::before{content:"";width:8px;height:30px;border-radius:4px;background:var(--accent)}
.sec-head .line{flex:1;height:1px;background:var(--line)}
.sec-head .more{font-size:17px;color:var(--accent);background:var(--accent-soft);padding:4px 16px;border-radius:999px;white-space:nowrap}
.sec-head .more:hover{background:var(--accent);color:var(--accent-ink)}
.page-title{text-align:center;font-size:54px;margin:40px 0 10px;color:var(--ink)}
.subnav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:30px}
.subnav a{font-size:18px;color:var(--ink-2);border:1px solid var(--line);background:var(--surface);padding:3px 16px;border-radius:999px}
.subnav a:hover,.subnav a.active{border-color:var(--accent);color:var(--accent)}

/* ===== ފޮޓޯ ===== */
.ph{background:linear-gradient(135deg,var(--surface-2),var(--line));position:relative;overflow:hidden}
.ph::after{content:"ފޮޓޯ";position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:18px}
.ph img{position:relative;z-index:1;transition:transform .5s ease}
a:hover .ph img,.zoom:hover .ph img{transform:scale(1.05)}

/* ===== ބޮޑު ޚަބަރުތައް (ހީރޯ) ===== */
.hero{display:grid;grid-template-columns:1fr 1.9fr 1fr;gap:22px;margin-top:22px}
.panel{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.lead{position:relative}
.lead .ph{aspect-ratio:16/10}
.lead .body{padding:22px 26px 24px}
.lead h2{font-size:40px;line-height:1.7;margin:8px 0}
.lead h2 a:hover{color:var(--accent)}
.lead .excerpt{color:var(--ink-2);font-size:20px;line-height:2;margin:0}
.badge{display:inline-block;font-size:15px;padding:1px 14px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.badge:hover{background:var(--accent);color:var(--accent-ink)}
.on-img{position:absolute;top:14px;right:14px;z-index:2;background:var(--accent);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.meta{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:15px;margin-top:12px;flex-wrap:wrap}
.meta .num{display:inline-flex;gap:5px;align-items:center}
.meta .pill{border:1px solid var(--line);border-radius:999px;padding:2px 12px}
.author{display:flex;align-items:center;gap:8px;font-family:var(--body-font);font-size:16px}
.author .ph{width:34px;height:34px;border-radius:50%}
.author .ph::after{content:""}
.stack{display:flex;flex-direction:column;gap:22px}
.side-card{position:relative;display:block;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);flex:1;min-height:250px}
.side-card .ph{position:absolute;inset:0}
.side-card .ov{position:absolute;inset:0;z-index:2;background:linear-gradient(to top,rgba(8,12,24,.88) 0%,rgba(8,12,24,.35) 55%,transparent 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:18px;color:#fff}
.side-card h3{font-size:23px;line-height:1.75}
.side-card .meta{color:#cfd5e4}
.side-card .meta .pill{border-color:rgba(255,255,255,.3)}
.mini{display:grid;grid-template-columns:1fr 104px;gap:14px;padding:16px;border-bottom:1px solid var(--line);align-items:start}
.mini:last-child{border-bottom:0}
.mini .ph{aspect-ratio:1;border-radius:12px}
.mini h3{font-size:19px;line-height:1.8}
.mini h3 a:hover{color:var(--accent)}
.mini .meta{margin-top:4px;font-size:14px}
.panel-title{font-family:var(--head-font);font-size:22px;padding:14px 16px 4px;color:var(--accent)}

/* ===== ކާޑުތައް ===== */
.layout{display:grid;grid-template-columns:1fr 340px;gap:28px;align-items:start}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.cards.four{grid-template-columns:repeat(4,1fr)}
.card{background:var(--surface);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.card .ph{aspect-ratio:16/10}
.card .c-body{padding:14px 18px 18px;display:flex;flex-direction:column;flex:1}
.card h3{font-size:21px;line-height:1.8;margin:8px 0 0}
.card h3 a:hover{color:var(--accent)}
.card .meta{margin-top:auto;padding-top:10px}

/* ===== ސައިޑްބާ ===== */
aside.sidebar{display:flex;flex-direction:column;gap:22px;position:sticky;top:100px}
.box{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px}
.box h3{font-size:23px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.box h3 .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--hot-soft);color:var(--hot)}
.rank{list-style:none;margin:0;padding:0;counter-reset:r}
.rank li{counter-increment:r;display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start;padding:12px 0;border-bottom:1px dashed var(--line)}
.rank li:last-child{border-bottom:0}
.rank li::before{content:counter(r);font-family:var(--ui-font);font-weight:800;font-size:30px;line-height:1.1;color:transparent;-webkit-text-stroke:1.5px var(--accent);text-align:center}
.rank a{font-size:18px;line-height:1.8}
.rank a:hover{color:var(--accent)}
.verse{background:linear-gradient(160deg,var(--accent-soft),var(--surface));border:1px solid var(--line);text-align:center}
.verse h3{justify-content:center;color:var(--gold)}
.verse .ar{font-family:var(--arabic-font);direction:rtl;font-size:32px;line-height:2.1;color:var(--ink);margin:6px 0}
.verse .dv{font-size:18px;color:var(--ink-2);line-height:2}
.verse .ref{font-size:15px;color:var(--muted);margin-top:6px}
.verse .dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.verse .dots button{width:9px;height:9px;padding:0;border-radius:50%;border:0;background:var(--line);cursor:pointer}
.verse .dots button.on{background:var(--accent);width:22px;border-radius:5px}
.sq-ad{border-radius:var(--radius);overflow:hidden;background:linear-gradient(150deg,#ffd23f,#ff9f43);color:#1a2135;padding:24px;text-align:center;box-shadow:var(--shadow)}
.sq-ad .ad-label{text-align:center;color:#6b4d00}
.sq-ad h4{font-size:28px;line-height:1.7}
.sq-ad p{margin:4px 0 14px;font-size:18px}
.sq-ad a{display:inline-block;background:#1a2135;color:#fff;border-radius:999px;padding:6px 22px;font-size:18px}
.sq-ad.has-image{padding:0;background:none}
.sq-ad.has-image img{height:auto}

/* ===== ބައިތައް ===== */
.cat-block{display:grid;grid-template-columns:1.3fr 1fr;gap:22px}
.cat-block .big{position:relative;display:block;border-radius:var(--radius);overflow:hidden;min-height:340px;box-shadow:var(--shadow)}
.cat-block .big .ph{position:absolute;inset:0}
.cat-block .big .ov{position:absolute;inset:0;z-index:2;background:linear-gradient(to top,rgba(8,12,24,.9),transparent 65%);display:flex;flex-direction:column;justify-content:flex-end;padding:24px;color:#fff}
.cat-block .big h3{font-size:30px;line-height:1.7}
.cat-block .big p{margin:4px 0 0;color:#dfe4f0;font-size:18px}
.cat-block .list{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}

/* ===== ފޮޓޯ ގެލަރީ ===== */
.gallery{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:16px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.gallery a{position:relative;display:block;aspect-ratio:3/4;border-radius:var(--radius);overflow:hidden;scroll-snap-align:start;box-shadow:var(--shadow)}
.gallery .ph{position:absolute;inset:0}
.gallery .cap{position:absolute;inset:auto 0 0 0;z-index:2;padding:40px 16px 14px;background:linear-gradient(to top,rgba(0,0,0,.85),transparent);color:#fff;font-size:18px;line-height:1.8}
.gal-wrap{background:var(--ink);margin-top:56px;padding:6px 0 30px}
.gal-wrap .sec-head h2{color:#fff}
.gal-wrap .sec-head .line{background:rgba(255,255,255,.15)}
:root[data-theme="dark"] .gal-wrap{background:#0a0e18}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .gal-wrap{background:#0a0e18}}

/* ===== ޚަބަރު ސަފްހާ ===== */
.progress{position:fixed;top:0;right:0;height:4px;background:var(--hot);z-index:60;width:0;transition:width .1s}
.crumbs{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:17px;margin:30px 0 0;flex-wrap:wrap}
.crumbs a:hover{color:var(--accent)}
.article{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:30px 40px 34px;margin-top:14px}
.article h1{font-size:46px;line-height:1.7;margin:10px 0 6px}
.article .hero-img{aspect-ratio:16/9;border-radius:14px;margin:20px 0 26px}
.article .lede{font-size:calc(24px * var(--fs));line-height:2.1;color:var(--ink);margin:0 0 18px;padding-right:16px;border-right:4px solid var(--accent)}
.article .text p{font-size:calc(21px * var(--fs));line-height:2.25;color:var(--ink-2);margin:0 0 18px;text-align:justify}
.share{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
.share span{color:var(--muted);font-size:17px}
.share a,.share button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 18px;cursor:pointer;font-size:17px;font-family:var(--body-font)}
.share a:hover,.share button:hover{border-color:var(--accent);color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:60px 0;font-size:22px}

/* ===== ހޯދުން ===== */
.search{position:fixed;inset:0;z-index:80;background:rgba(10,14,24,.55);backdrop-filter:blur(4px);display:none;padding:80px 16px}
.search.open{display:block}
.search .sbox{max-width:720px;margin:0 auto;background:var(--surface);border-radius:20px;box-shadow:var(--shadow-lg);overflow:hidden}
.search input{width:100%;border:0;border-bottom:1px solid var(--line);padding:20px 24px;font-family:var(--body-font);font-size:24px;background:transparent;color:var(--ink);outline:none}
.search .results{max-height:60vh;overflow-y:auto}
.search .results a{display:grid;grid-template-columns:1fr 80px;gap:14px;padding:12px 24px;border-bottom:1px solid var(--line);align-items:center}
.search .results a:hover{background:var(--accent-soft)}
.search .results .ph{aspect-ratio:1;border-radius:10px}
.search .hint{padding:16px 24px;color:var(--muted);font-size:17px}

/* ===== ފުޓަރު ===== */
footer{margin-top:70px;background:var(--ink);color:#c9cfdd;padding:50px 0 26px}
:root[data-theme="dark"] footer{background:#0a0e18}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) footer{background:#0a0e18}}
.foot{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:34px}
footer .logo{color:#fff}
footer .logo img{filter:brightness(0) invert(1)}
footer h4{color:#fff;font-size:22px;margin-bottom:10px}
footer p{margin:10px 0 0;font-size:18px;line-height:2}
.foot-links{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;font-size:18px}
.foot-links a:hover,.contact a:hover{color:#fff}
.contact{display:flex;flex-direction:column;gap:6px;font-size:18px}
.socials{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.socials a{border:1px solid #39425a;border-radius:999px;padding:3px 14px;font-size:16px}
.socials a:hover{background:#fff;color:#1a2135}
.copy{border-top:1px solid #2c3347;margin-top:34px;padding-top:18px;font-size:15px;text-align:center}
.to-top{position:fixed;left:18px;bottom:18px;z-index:40;width:48px;height:48px;border-radius:50%;border:0;background:var(--accent);color:#fff;box-shadow:var(--shadow-lg);cursor:pointer;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .25s}
.to-top.show{opacity:1;pointer-events:auto}

/* ===== މޯބައިލް ===== */
@media (max-width:1100px){
  .hero{grid-template-columns:1fr 1fr}
  .hero .lead{grid-column:1/-1;order:-1}
  .layout{grid-template-columns:1fr}
  aside.sidebar{position:static;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
  .cards.four{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:760px){
  body{font-size:18px}
  .menu{display:none}
  .menu.open{display:flex;flex-direction:column;position:absolute;top:78px;right:0;left:0;background:var(--surface);padding:10px 16px;gap:4px;border-bottom:1px solid var(--line);box-shadow:var(--shadow-lg)}
  .burger{display:grid}
  .actions .btn{display:none}
  .logo{font-size:32px}.logo img{width:42px;height:42px}
  .nav{gap:12px}
  .ad{grid-template-columns:1fr;text-align:center;padding:24px 20px;gap:12px;justify-items:center}
  .ad .ad-logo{width:70px;height:70px;border-radius:18px;padding:8px}
  .ad h2{font-size:26px}
  .ad p{display:none}
  .hero{grid-template-columns:1fr}
  .lead h2{font-size:30px}
  .lead .body{padding:18px}
  .cards,.cards.four{grid-template-columns:1fr}
  .cat-block{grid-template-columns:1fr}
  .cat-block .big{min-height:260px}
  .page-title{font-size:40px}
  .article{padding:20px 18px}
  .article h1{font-size:30px}
  .foot{grid-template-columns:1fr}
  .ticker .tag{padding:8px 14px;font-size:17px}
  .dates .greg{display:none}
}
</style>
</head>
<body>
<div class="progress" id="progress"></div>

<div class="topbar">
  <div class="wrap">
    <div class="dates"><span id="dateGreg" class="greg"></span><span class="sep greg">|</span><span id="dateHijri"></span></div>
    <div class="tools">
      <button class="tool" id="fsDown" title="ލިޔުން ކުޑަކުރޭ"><span class="num">A−</span></button>
      <button class="tool" id="fsUp" title="ލިޔުން ބޮޑުކުރޭ"><span class="num">A+</span></button>
      <button class="tool" id="themeBtn" title="ރޭގަނޑު / ދުވާލު">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <span id="themeLabel">ރޭގަނޑު</span>
      </button>
    </div>
  </div>
</div>

<div class="wrap ad-wrap">
  <div class="ad-label">ADVERTISEMENT</div>
  <div id="topAd"></div>
</div>

  }catch(e){ $("dateHijri").textContent = ""; }
  $("year").textContent = d.getFullYear();
})();

/* ----- ރޭގަނޑު / ދުވާލު، ލިޔުމުގެ ސައިޒު ----- */
const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };
function isDark(){ const t=document.documentElement.dataset.theme; return t ? t==="dark" : matchMedia("(prefers-color-scheme: dark)").matches; }
function applyTheme(t){ if(t) document.documentElement.dataset.theme=t; $("themeLabel").textContent = isDark() ? "ދުވާލު" : "ރޭގަނޑު"; }
applyTheme(store.get("theme"));
$("themeBtn").onclick = () => { const t = isDark() ? "light" : "dark"; store.set("theme",t); applyTheme(t); };
let fs = parseFloat(store.get("fs")) || 1;
const applyFs = () => document.documentElement.style.setProperty("--fs", fs);
applyFs();
$("fsUp").onclick = () => { fs = Math.min(1.4, +(fs+.1).toFixed(1)); store.set("fs",fs); applyFs(); };
$("fsDown").onclick = () => { fs = Math.max(.8, +(fs-.1).toFixed(1)); store.set("fs",fs); applyFs(); };

      <div class="ad-text"><span class="ad-kicker">${TOP_AD.kicker}</span><h2>${TOP_AD.title}</h2><p>${TOP_AD.text}</p></div>

const sideAd = () => SIDE_AD.image
  ? `<a class="sq-ad has-image" href="${SIDE_AD.link}"><img src="${SIDE_AD.image}" alt="އިޝްތިހާރު"></a>`
  : `<div class="sq-ad"><div class="ad-label">ADVERTISEMENT</div><h4>${SIDE_AD.title}</h4><p>${SIDE_AD.text}</p><a href="${SIDE_AD.link}">${SIDE_AD.button}</a></div>`;

/* ----- ހެޑަރު، ފުޓަރު ----- */
document.querySelectorAll(".logo-text").forEach(l => l.textContent = SITE_NAME);
$("aboutText").textContent = ABOUT;
$("footLinks").innerHTML = MENU.map(m=>`<a href="${catLink(m)}">${m}</a>`).join("");
$("contact").innerHTML = `<span>ފޯނު: <span class="num">${CONTACT.phone}</span></span>
  <a class="num" href="mailto:${CONTACT.email}">${CONTACT.email}</a><span>${CONTACT.address}</span>`;
$("contact").parentElement.id = "contact-col";
$("socials").innerHTML = SOCIALS.map(([n,l])=>`<a href="${l}">${n}</a>`).join("");
function renderNav(active){
  $("menu").innerHTML = `<a href="#/" class="${!active?'active':''}">${HOME_LABEL}</a>` +
    MENU.map(m=>`<a href="${catLink(m)}" class="${active===m?'active':''}">${m}</a>`).join("");
}
const subnav = active => `<nav class="subnav">` +
  SUBNAV.map(s=>`<a href="${catLink(s)}" class="${active===s?'active':''}">${s}</a>`).join("") + `</nav>`;
const secHead = (title, more) => `<div class="sec-head"><h2>${title}</h2><span class="line"></span>${more?`<a class="more" href="${more}">އިތުރަށް ‹</a>`:""}</div>`;

/* ----- ސައިޑްބާ ----- */
let verseIdx = Math.floor((Date.now() - new Date(new Date().getFullYear(),0,0)) / 864e5) % VERSES.length;
function verseBox(){
  const v = VERSES[verseIdx % VERSES.length];
  return `<div class="box verse" id="verseBox"><h3>މިއަދުގެ ނަސޭހަތް</h3>
    <div class="ar">${v.ar}</div><div class="dv">${v.dv}</div><div class="ref">${v.ref}</div>
    <div class="dots">${VERSES.map((_,i)=>`<button class="${i===verseIdx%VERSES.length?'on':''}" onclick="setVerse(${i})" aria-label="${i+1}"></button>`).join("")}</div></div>`;
}
function setVerse(i){ verseIdx=i; const el=$("verseBox"); if(el) el.outerHTML = verseBox(); }
const sidebar = () => `<aside class="sidebar">
  <div class="box"><h3><span class="ic">${fire}</span>މަޤުބޫލު ޚަބަރު</h3>
    <ol class="rank">${popular().map(n=>`<li><a href="${art(n)}">${n.title}</a></li>`).join("")}</ol></div>
  ${verseBox()}
  ${sideAd()}
</aside>`;

/* ----- ޓިކަރ ----- */
function ticker(){
  const list = ARTICLES.filter(a=>a.breaking);
  if(!list.length) return "";
  const items = list.map(n=>`<a href="${art(n)}">${n.title}</a>`).join("");
  return `<div class="ticker"><span class="tag"><span class="dot"></span>އާ ޚަބަރު</span>
    <div class="viewport"><div class="track">${items}${items}${items}${items}</div></div></div>`;
}

/* ----- ހޯމް ----- */
function home(){
  renderNav(null);
  const lead = ARTICLES.find(a=>a.place==="lead") || ARTICLES[0];
  const side = ARTICLES.filter(a=>a.place==="side");
  const small = ARTICLES.filter(a=>a.place==="small");
  const cards = ARTICLES.filter(a=>a.place==="card");
  const blocks = HOME_BLOCKS.map(c=>{
    const list = ARTICLES.filter(a=>a.category===c);
    if(!list.length) return "";
    return secHead(c, catLink(c)) + `<div class="cat-block">${overlay(list[0],"big")}
      <div class="list">${list.slice(1,4).map(mini).join("") || `<p class="empty" style="padding:30px">އިތުރު ޚަބަރެއް ނެތް</p>`}</div></div>`;
  }).join("");
  app.innerHTML = `
  <div class="wrap">
    ${ticker()}
    <section class="hero">
      <div class="stack">${side.map(n=>overlay(n,"side-card")).join("")}</div>
      <div class="panel lead zoom">
        <a href="${art(lead)}">${pic(lead.image)}</a>
        <a class="badge on-img" href="${catLink(lead.category)}">${lead.category}</a>
        <div class="body">
          <h2><a href="${art(lead)}">${lead.title}</a></h2>
          <p class="excerpt">${lead.excerpt}</p>
          <div class="meta"><div class="author">${pic(lead.authorImage)}<span>${lead.author||DEFAULT_AUTHOR}</span></div>
            <span class="num">${clock}${lead.time}</span>
            ${lead.comments!==undefined?`<span class="num pill">${bubble}${lead.comments}</span>`:""}</div>
        </div>
      </div>
      <div class="panel"><div class="panel-title">ދެން ހުރި ޚަބަރު</div>${small.map(mini).join("")}</div>
    </section>
    ${secHead("އެންމެ ފަހުގެ ޚަބަރު")}
    <div class="layout">
      <section class="cards">${cards.map(card).join("")}</section>
      ${sidebar()}
    </div>
    ${blocks}
  </div>
  <section class="gal-wrap"><div class="wrap">${secHead("ފޮޓޯ ގެލަރީ")}
    <div class="gallery">${ARTICLES.filter(a=>a.image).map(n=>`<a href="${art(n)}">${pic(n.image)}<span class="cap">${n.title}</span></a>`).join("")}</div>
  </div></section>`;
}

/* ----- ބައި ----- */
function category(name){
  renderNav(MENU.includes(name) ? name : null);
  const list = ARTICLES.filter(a=>a.category===name || a.sub===name);
  app.innerHTML = `<div class="wrap">
    <h1 class="page-title">${name}</h1>${subnav(name)}
    <div class="layout">
      ${list.length ? `<section class="cards">${list.map(card).join("")}</section>`
                    : `<p class="empty">މި ބައިގައި އަދި ޚަބަރެއް ނެތް</p>`}
      ${sidebar()}
    </div></div>`;
  document.title = `${name} | ${SITE_NAME}`;
}

/* ----- ޚަބަރު ----- */
function article(id){
  const n = ARTICLES.find(a=>a.id===id);
  if(!n){ location.hash = "#/"; return; }
  renderNav(n.category);
  const paras = (n.body && n.body.length ? n.body : DEFAULT_BODY);
  const words = (n.excerpt + " " + paras.join(" ")).split(/\s+/).length;
  const mins = Math.max(1, Math.round(words/180));
  let related = ARTICLES.filter(a=>a.id!==n.id && (a.category===n.category || a.sub===n.sub));
  if(related.length < 3) related = related.concat(ARTICLES.filter(a=>a.id!==n.id && !related.includes(a)));
  const url = encodeURIComponent(location.href), t = encodeURIComponent(n.title);
  app.innerHTML = `<div class="wrap">
    <div class="crumbs"><a href="#/">${HOME_LABEL}</a> ‹ <a href="${catLink(n.category)}">${n.category}</a>
      ${n.sub?` ‹ <a href="${catLink(n.sub)}">${n.sub}</a>`:""}</div>
    <div class="layout">
      <div>
        <article class="article">
          <a class="badge" href="${catLink(n.category)}">${n.category}</a>
          <h1>${n.title}</h1>
          <div class="meta">
            <div class="author">${pic(n.authorImage||"images/author.jpg")}<span>${n.author||DEFAULT_AUTHOR}</span></div>
            <span class="num">${clock}${n.time}</span>
            <span><span class="num">${mins}</span> މިނެޓުގެ ކިޔުމެއް</span>
            ${n.comments!==undefined?`<span class="num pill">${bubble}${n.comments}</span>`:""}
          </div>
          ${pic(n.image,"hero-img")}
          <p class="lede">${n.excerpt}</p>
          <div class="text">${paras.map(p=>`<p>${p}</p>`).join("")}</div>
          <div class="share"><span>ޝެއާ ކުރައްވާ:</span>
            <a href="https://wa.me/?text=${t}%20${url}" target="_blank" rel="noopener">ވަޓްސްއެޕް</a>
            <a href="https://www.facebook.com/sharer/sharer.php?u=${url}" target="_blank" rel="noopener">ފޭސްބުކް</a>
            <a href="https://x.com/intent/tweet?text=${t}&url=${url}" target="_blank" rel="noopener">އެކްސް</a>
            <button onclick="navigator.clipboard&&navigator.clipboard.writeText(location.href);this.textContent='ކޮޕީކުރެވިއްޖެ ✓'">ލިންކު ކޮޕީކުރޭ</button>
          </div>
        </article>
        ${secHead("ގުޅޭ ޚަބަރު")}
        <section class="cards">${related.slice(0,3).map(card).join("")}</section>
      </div>
      ${sidebar()}
    </div></div>`;
  document.title = `${n.title} | ${SITE_NAME}`;
}

/* ----- ހޯދުން ----- */
function openSearch(){ $("search").classList.add("open"); $("q").value=""; runSearch(); setTimeout(()=>$("q").focus(),50); }
function closeSearch(){ $("search").classList.remove("open"); }
function runSearch(){
  const q = $("q").value.trim();
  const list = q ? ARTICLES.filter(a=>(a.title+" "+a.excerpt+" "+a.category+" "+(a.sub||"")).includes(q)) : [];
  $("results").innerHTML = !q ? `<div class="hint">ސުރުހީގެ ބަހެއް ނުވަތަ ބައެއްގެ ނަމެއް ލިޔުއްވާ</div>`
    : list.length ? list.map(n=>`<a href="${art(n)}" onclick="closeSearch()"><div><span class="badge">${n.category}</span><div>${n.title}</div></div>${pic(n.image)}</a>`).join("")
    : `<div class="hint">ހޯދި ބަހާ ގުޅޭ ޚަބަރެއް ނުފެނުނު</div>`;
}
$("searchBtn").onclick = openSearch;
$("q").oninput = runSearch;
$("search").onclick = e => { if(e.target.id==="search") closeSearch(); };
document.addEventListener("keydown", e => { if(e.key==="Escape") closeSearch(); });

/* ----- ސްކްރޯލް ----- */
window.addEventListener("scroll", () => {
  const h = document.documentElement;
  $("toTop").classList.toggle("show", h.scrollTop > 700);
  const onArticle = location.hash.startsWith("#/article/");
  const p = onArticle ? h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight) * 100 : 0;
  $("progress").style.width = p + "%";
}, {passive:true});
$("toTop").onclick = () => window.scrollTo({top:0,behavior:"smooth"});

/* ----- ރައުޓު ----- */
function route(){
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  if(h==="contact"){ if(!app.innerHTML) home(); document.getElementById("contact-col").scrollIntoView({behavior:"smooth"}); return; }
  $("menu").classList.remove("open");
  document.title = SITE_NAME;
  if(h.startsWith("article/")) article(h.slice(8));
  else if(h.startsWith("cat/")) category(h.slice(4));
  else home();
  window.scrollTo(0,0);
  $("progress").style.width = "0";
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
